<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Social SRS — فلش‌کارت معاشرت</title>
  <meta name="description" content="فلش‌کارت‌های مهارت گفت‌وگو و معاشرت با مرور فاصله‌دار؛ آفلاین و نصب‌پذیر.">
  <meta name="theme-color" content="#0d0e11">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Social SRS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // اعمال زودهنگام تم و رنگ، برای جلوگیری از پرش رنگ هنگام بارگذاری
    (function () {
      try {
        var s = (JSON.parse(localStorage.getItem('ssrs.v2')) || {}).settings || {};
        var t = s.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (s.accent) document.documentElement.dataset.accent = s.accent;
        if (s.fontScale) document.documentElement.style.setProperty('--fs', s.fontScale);
        var m = document.querySelector('meta[name=theme-color]');
        if (m) m.content = t === 'light' ? '#f4f5f8' : '#0d0e11';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <nav class="nav" id="nav" aria-label="ناوبری اصلی"></nav>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="dlg" class="dlg"></dialog>
  <noscript><p style="padding:24px;text-align:center">برای اجرای این برنامه، جاوااسکریپت را فعال کنید.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
