# هر push روی main: تست ← ثبت نسخه‌ی خودکار ← انتشار در GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Build site folder
        run: |
          mkdir dist
          tar --exclude='./.git' --exclude='./.github' --exclude='./tests' --exclude='./dist' \
              --exclude='./package.json' --exclude='./README.md' --exclude='./.gitignore' \
              -cf - . | tar -xf - -C dist

      - name: Stamp version (date + commit)
        run: |
          STAMP="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed -i "s/const VERSION = '[^']*';/const VERSION = '${STAMP}';/" dist/sw.js dist/js/views/settings.js
          grep -n "const VERSION" dist/sw.js dist/js/views/settings.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
